name: Release

# DISABLED: Automatic triggers disabled to save CI/CD resources
# Run manually via workflow_dispatch or re-enable when ready to release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: true
        type: string
  # push:
  #   tags:
  #     - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Dragon Quest III ROM Analysis Tool Release

          ## Changes
          - Updated ROM analysis tools
          - Enhanced plugin system
          - Bug fixes and improvements
        draft: false
        prerelease: false
