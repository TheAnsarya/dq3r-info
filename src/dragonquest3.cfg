# Dragon Quest III Linker Configuration
# SNES HiROM memory layout for extracted code

FEATURES {
    STARTADDRESS: default = $008000;
}

SYMBOLS {
    # Hardware vectors
    __RESET_HANDLER__ = $FFB6;
}

MEMORY {
    # Boot ROM (Bank 00) - Reset vectors and boot code
    BOOT:    start = $008000, size = $8000, type = rw, file = %O;

    # Engine ROM (Bank 01) - Main game engine
    ENGINE:  start = $018000, size = $8000, type = rw, file = %O;

    # Battle ROM (Bank 02) - Battle system
    BATTLE:  start = $028000, size = $8000, type = rw, file = %O;

    # Header area for vectors
    HEADER:  start = $7F8000, size = $8000, type = rw, file = %O;
}

SEGMENTS {
    # Code segments
    BOOT_CODE:    load = BOOT,     type = ro;
    ENGINE_CODE:  load = ENGINE,   type = ro;
    BATTLE_CODE:  load = BATTLE,   type = ro;

    # SNES vectors
    VECTORS:      load = HEADER,   type = ro, start = $FFE0;
}

FILES {
    %O: format = bin;
}
